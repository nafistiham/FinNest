name: bhorosha
description: "FinNest: the Bangla-first customer app with FinNest Assistant (FNA), the voice guide that stops scams in time."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State, navigation, networking
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  dio: ^5.11.1

  # Firebase (Dart-side initialisation only, optional at boot)
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.0
  firebase_app_check: ^0.5.0
  firebase_ai: 5.0.0 # exact: fna_live_transport imports src/live_api.dart

  # Device and media
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
  record: ^7.1.2
  sensors_plus: ^7.1.1
  permission_handler: ^13.0.2
  local_auth: ^2.3.0
  url_launcher: ^6.3.3

  # Storage and utilities
  shared_preferences: ^2.5.6
  # Enrolment export to the app-scoped external dir.
  path_provider: ^2.1.6
  crypto: ^3.0.6
  meta: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/
    - assets/demo/
    - assets/apa/
    - assets/fna_kb/
    - assets/brand/

  fonts:
    # Display face for big amounts (DisplayAmountStyle): Baloo Da 2, one
    # variable file (wght 400-800) covering Bangla and Latin digits. OFL,
    # see assets/fonts/OFL-BalooDa2.txt.
    - family: BalooDa2
      fonts:
        - asset: assets/fonts/BalooDa2-Variable.ttf
    # Bangla text face: SolaimanLipi, OFL, see assets/fonts/OFL-SolaimanLipi.txt.
    - family: SolaimanLipi
      fonts:
        - asset: assets/fonts/SolaimanLipi.ttf
        - asset: assets/fonts/SolaimanLipiBold.ttf
          weight: 700
